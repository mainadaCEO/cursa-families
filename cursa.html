<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>Cursa de Famílies</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff;
      padding: 20px;
      text-align: center;
      color: #111;
      overflow-x: hidden;
      overflow-y: hidden;
      position: relative;
    }

    .banner {
      width: 100%;
      height: 20px;
      background: repeating-linear-gradient(45deg, #000 0, #000 15px, #fff 15px, #fff 30px);
      margin-bottom: 20px;
    }

    h1 {
      margin: 10px 0 20px 0;
      color: #000;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    #groupTitle {
      color: #000;
      background: #fff;
      display: inline-block;
      padding: 5px 15px;
      border: 2px solid #000;
      border-radius: 10px;
      margin-top: 10px;
    }

    #menu {
      margin-bottom: 20px;
    }
    button {
      margin: 6px;
      padding: 10px 16px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      border: 2px solid #000;
      background-color: #fff;
      color: #000;
      transition: all 0.2s ease;
    }
    button:hover {
      background-color: #000;
      color: #fff;
      transform: scale(1.05);
    }
    .active {
      background-color: #000 !important;
      color: #fff !important;
    }

    .lane {
      display: flex;
      align-items: center;
      margin-bottom: 30px;
      position: relative;
    }

    .family-name {
      width: 180px;
      font-weight: bold;
      text-align: right;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
    }

    .track-container {
      flex: 1;
      position: relative;
      height: 40px;
      background: #ddd;
      border-radius: 20px;
      margin: 0 20px;
      overflow: hidden;
    }

    .track-container::after {
      content: "";
      position: absolute;
      right: 0;
      top: 0;
      width: 10px;
      height: 100%;
      background: repeating-linear-gradient(45deg, #000 0, #000 5px, #fff 5px, #fff 10px);
      border-radius: 0 20px 20px 0;
      opacity: 0.5;
    }

    .car {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 24px;
      transition: left 2s ease-in-out;
      color: #000;
      filter: drop-shadow(0 0 2px #333);
    }

    .car.gold-glow { filter: drop-shadow(0 0 8px #FFD700); }
    .car.silver-glow { filter: drop-shadow(0 0 8px #C0C0C0); }
    .car.bronze-glow { filter: drop-shadow(0 0 8px #CD7F32); }

    .points {
      width: 50px;
      text-align: right;
      font-weight: bold;
    }

    /* 🔥 Flames */
    .flame {
      position: fixed;
      bottom: -20px;
      width: 20px;
      height: 40px;
      background: radial-gradient(circle, rgba(255,140,0,0.9) 0%, rgba(255,69,0,0.6) 50%, rgba(255,0,0,0) 80%);
      border-radius: 50% 50% 0 0;
      animation: flameRise 2.5s linear forwards;
      z-index: 9999;
      opacity: 0.8;
      pointer-events: none;
    }

    @keyframes flameRise {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(-120vh) scale(0.2);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="banner"></div>
  <h1>🏁 Rànquing de la Cursa de Famílies 🏁</h1>

  <div id="menu">
    <button onclick="loadGroup('MINIMENUTS')">MINIMENUTS</button>
    <button onclick="loadGroup('MENUTS')">MENUTS</button>
    <button onclick="loadGroup('PETITS')">PETITS</button>
    <button onclick="loadGroup('MITJANS')">MITJANS</button>
    <button onclick="loadGroup('GRANS')">GRANS</button>
    <button onclick="loadGroup('JOVES')">JOVES</button>
  </div>

  <h2 id="groupTitle">MENUTS</h2>
  <button onclick="startRace()">🏎️ Començar cursa</button>

  <div id="lanes"></div>

  <script>
    const sheetUrls = {
      MINIMENUTS: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTc4VPSmkvnbZcw6EcsPNmuYab7yJkUh6s3FTof1nUWZrL7BMd7SB8ECL5jaBTtS635wZH9iqlgpKQV/pub?gid=248593049&single=true&output=csv',
      MENUTS: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTc4VPSmkvnbZcw6EcsPNmuYab7yJkUh6s3FTof1nUWZrL7BMd7SB8ECL5jaBTtS635wZH9iqlgpKQV/pub?gid=0&single=true&output=csv',
      PETITS: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTc4VPSmkvnbZcw6EcsPNmuYab7yJkUh6s3FTof1nUWZrL7BMd7SB8ECL5jaBTtS635wZH9iqlgpKQV/pub?gid=283609274&single=true&output=csv',
      MITJANS: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTc4VPSmkvnbZcw6EcsPNmuYab7yJkUh6s3FTof1nUWZrL7BMd7SB8ECL5jaBTtS635wZH9iqlgpKQV/pub?gid=134553576&single=true&output=csv',
      GRANS: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTc4VPSmkvnbZcw6EcsPNmuYab7yJkUh6s3FTof1nUWZrL7BMd7SB8ECL5jaBTtS635wZH9iqlgpKQV/pub?gid=712554559&single=true&output=csv',
      JOVES: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTc4VPSmkvnbZcw6EcsPNmuYab7yJkUh6s3FTof1nUWZrL7BMd7SB8ECL5jaBTtS635wZH9iqlgpKQV/pub?gid=86703089&single=true&output=csv'
    };

    let currentGroup = 'MENUTS';
    let families = [];

    const lanesDiv = document.getElementById("lanes");

    async function loadGroup(group) {
      currentGroup = group;
      document.getElementById("groupTitle").textContent = group;
      document.querySelectorAll("#menu button").forEach(b => b.classList.remove("active"));
      event.target.classList.add("active");
      await loadFamilies();
    }

    async function loadFamilies() {
      const sheetUrl = sheetUrls[currentGroup];
      const resposta = await fetch(sheetUrl);
      const text = await resposta.text();
      const files = text.trim().split("\n");

      families = files.slice(1).map(linea => {
        const [name, points, color] = linea.split(",");
        return {
          name: name.trim(),
          points: parseInt(points.trim()) || 0,
          color: color ? color.trim() : "#000000"
        };
      });

      families.sort((a, b) => b.points - a.points);
      createLanes(families);
    }

    function createLanes(families) {
      lanesDiv.innerHTML = "";
      families.forEach((fam, index) => {
        const lane = document.createElement("div");
        lane.className = "lane";

        const nameDiv = document.createElement("div");
        nameDiv.className = "family-name";

        const medal = document.createElement("span");
        if (index === 0) medal.textContent = "🥇";
        else if (index === 1) medal.textContent = "🥈";
        else if (index === 2) medal.textContent = "🥉";

        nameDiv.appendChild(medal);
        nameDiv.append(fam.name);

        const trackContainer = document.createElement("div");
        trackContainer.className = "track-container";

        const car = document.createElement("i");
        car.className = "fas fa-car car";
        if (index === 0) car.classList.add("gold-glow");
        else if (index === 1) car.classList.add("silver-glow");
        else if (index === 2) car.classList.add("bronze-glow");

        car.style.left = "0%";
        trackContainer.appendChild(car);

        const pointsDiv = document.createElement("div");
        pointsDiv.className = "points";
        pointsDiv.textContent = fam.points;

        lane.appendChild(nameDiv);
        lane.appendChild(trackContainer);
        lane.appendChild(pointsDiv);
        lanesDiv.appendChild(lane);
      });
    }

    function animateRace() {
      const maxPoints = Math.max(...families.map(f => f.points)) || 1;
      const tracks = document.querySelectorAll(".track-container");

      tracks.forEach((track, index) => {
        const car = track.querySelector(".car");
        const fam = families[index];
        let target = (fam.points / maxPoints) * 100;
        if (target > 100) target = 100;
        car.style.left = `${target}%`;
      });
    }

    function startRace() {
      animateRace();
      launchFlames();
    }

    function launchFlames() {
      for (let i = 0; i < 50; i++) {
        const flame = document.createElement("div");
        flame.className = "flame";
        flame.style.left = Math.random() * 100 + "vw";
        flame.style.animationDuration = 2 + Math.random() * 2 + "s";
        document.body.appendChild(flame);
        setTimeout(() => flame.remove(), 2500);
      }
    }

    loadFamilies();
    setInterval(loadFamilies, 30000);
  </script>
</body>
</html>
